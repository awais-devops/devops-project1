<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Dashboard Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Segoe UI',sans-serif;
    background:#020617;
    color:#fff;
    transition:0.5s;
}

/* LIGHT MODE */
body.light{
    background:#f1f5f9;
    color:#000;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:20px 60px;
    backdrop-filter:blur(10px);
}

.logo{color:#38bdf8;font-weight:bold;font-size:22px;}

.toggle{
    cursor:pointer;
    padding:8px 15px;
    border-radius:20px;
    background:#38bdf8;
    color:#000;
}

/* HERO */
.hero{text-align:center;margin-top:80px;}

.hero h1{
    font-size:55px;
    background:linear-gradient(90deg,#38bdf8,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{margin-top:10px;color:#94a3b8;}

.btn{
    margin:10px;
    padding:12px 25px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-weight:bold;
    background:linear-gradient(90deg,#38bdf8,#22c55e);
    color:#000;
    transition:0.3s;
}

.btn:hover{transform:scale(1.1);}

/* STATS */
.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:50px;
}

.stat{
    margin:20px;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:15px;
    width:150px;
    text-align:center;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px 80px;
}

.card{
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:20px;
    text-align:center;
    transition:0.4s;
}

.card:hover{transform:scale(1.05);}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:80px;
    padding:20px;
    color:#64748b;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">🚀 DevOps Pro</div>
    <div class="toggle" onclick="toggleMode()">🌙 Mode</div>
</div>

<div class="hero">
    <h1>CI/CD Automation Dashboard</h1>
    <p>Build → Test → Deploy | Fully Automated Pipeline</p>

    <!-- BUTTONS -->
    <a href="https://github.com/awais-devops/devops-project1" target="_blank">
        <button class="btn">🔗 View Code</button>
    </a>

    <a href="http://54.169.215.181/" target="_blank">
        <button class="btn">🌐 Live Demo</button>
    </a>
</div>

<!-- STATS -->
<div class="stats">
    <div class="stat">
        <h2 id="builds">0</h2>
        <p>Builds</p>
    </div>
    <div class="stat">
        <h2 id="deploys">0</h2>
        <p>Deployments</p>
    </div>
    <div class="stat">
        <h2 id="uptime">0%</h2>
        <p>Uptime</p>
    </div>
</div>

<!-- TECH STACK -->
<div class="grid">
    <div class="card">🐳 Docker</div>
    <div class="card">⚙️ GitHub Actions</div>
    <div class="card">☁️ AWS EC2</div>
    <div class="card">🔐 SSH Deployment</div>
</div>

<div class="footer">
    💻 Built by DevOps Engineer | CI/CD Automation 🚀
</div>

<script>

/* DARK LIGHT MODE */
function toggleMode(){
    document.body.classList.toggle("light");
}

/* FAKE LIVE STATS (SIMULATION) */
let builds=0,deploys=0;

setInterval(()=>{
    builds++;
    deploys++;
    document.getElementById("builds").innerText=builds;
    document.getElementById("deploys").innerText=deploys;
    document.getElementById("uptime").innerText="99.9%";
},2000);

</script>

</body>
</html>
